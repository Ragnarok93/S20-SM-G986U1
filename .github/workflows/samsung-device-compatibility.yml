name: Samsung device compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  samsung-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate profile JSON and Python syntax
        run: |
          python -m json.tool src/targets/samsung-g986u1-4.19.113/device-profile.json >/dev/null
          python -m py_compile \
            tools/verify_samsung_device.py \
            tools/verify_samsung_firmware.py \
            tools/verify_samsung_kernel_source.py \
            tools/compare_samsung_kernel_configs.py

      - name: Validate generator patcher syntax
        run: |
          python -m py_compile \
            tools/audit_generator_compat.py \
            tools/patch_generator_fail_closed.py \
            tools/patch_legacy_boot_v2.py \
            tools/patch_optional_arm64_pe_stub.py \
            tools/verify_generator_boot_parser.py

      - name: Test generator compatibility audit and patch utilities
        run: |
          python -m unittest discover -s tests -p 'test_generator_compat_audit.py' -v
          python -m unittest discover -s tests -p 'test_patch_generator_fail_closed.py' -v
          python -m unittest discover -s tests -p 'test_patch_legacy_boot_v2.py' -v
          python -m unittest discover -s tests -p 'test_patch_optional_arm64_pe_stub.py' -v

      - name: Test live-device compatibility logic without requiring a device
        run: python -m unittest discover -s tests -p 'test_verify_samsung_device.py' -v

      - name: Test manifest and firmware-verifier contract
        run: python -m unittest discover -s tests -p 'test_samsung_profile_manifest.py' -v

      - name: Test kernel source compatibility preflight
        run: python -m unittest discover -s tests -p 'test_verify_samsung_kernel_source.py' -v

      - name: Test stock/source config comparison
        run: python -m unittest discover -s tests -p 'test_compare_samsung_kernel_configs.py' -v

      - name: Check Makefile profile discovery
        run: |
          make list-device-profiles | grep -Fx 'samsung-g986u1-4.19.113'
          make samsung-info
          make -n samsung-config-compare
          make -n samsung-generator-patches-check | grep -F 'tools/patch_generator_fail_closed.py'
          make -n samsung-generator-patches | grep -F 'tools/patch_generator_fail_closed.py'
          make -n samsung-generator-verify | grep -F 'tools/verify_generator_boot_parser.py'
